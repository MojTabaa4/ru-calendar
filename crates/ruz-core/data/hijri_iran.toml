# Official start dates of Lunar Hijri months in Iran.
#
# Iran begins each lunar month from moon sighting, so these dates can't be
# computed. They follow Iran's official calendar (Calendar Center, Institute of
# Geophysics, University of Tehran), read from the day-by-day Lunar Hijri dates
# that time.ir shows for each Solar Hijri year. Update once a year, and when a
# sighting moves a month. Outside this table Ruz falls back to Umm al-Qura and
# marks the date as approximate.
#
#   end = "YYYY-MM-DD"            first day the table no longer covers
#   [[year]]
#   year = 1447                   AH year
#   first_month = 1               month that starts[0] begins (default 1)
#   starts = ["YYYY-MM-DD", ...]  Gregorian date each consecutive month begins
#   source = "..."
#
# Consecutive starts must be 29 or 30 days apart (checked by tests). The last
# month may be cut short by `end`.

end = "2027-03-21"

[[year]]
year = 1446
first_month = 9
#         Ramadan       Shawwal       Dhu al-Qa'dah Dhu al-Hijjah
starts = ["2025-03-02", "2025-03-31", "2025-04-29", "2025-05-28"]
source = "official calendar 1404 SH via time.ir, read 2026-10-15"


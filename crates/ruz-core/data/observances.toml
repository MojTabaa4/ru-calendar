# Holidays and occasions shown by Ruz, written by the Ruz authors from public
# sources (see SOURCES.md). A curated set, not a copy of any other app's list.
#
# Each [[group]] fixes calendar (persian | gregorian | hijri), category
# (iranOfficial | iranHistorical | shiaExtra), subcategory (main | appendix |
# professions) and default day_off / mourning / source for its rows.
#
# A row has an id, a month, and either `day` (a number, or "last" for the last
# day of the month) or `weekday` + `nth` (1–5, or -1 for the last). Optional:
# offset (days from that date, e.g. -1 for its eve), day_off, mourning,
# since / until (Solar Hijri years), source.
#
# Hijri rows match Iran's official lunar dates (hijri_iran.toml). [[moved]] at the
# end records years when the official calendar placed a day differently.

default_source = "iran-official-calendar"


[package]
name = "ruz-cli"
description = "Command-line front end for ruz-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ruz"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
ruz-core = { version = "0.1.0", path = "../ruz-core" }
serde_json = "1.0.154"

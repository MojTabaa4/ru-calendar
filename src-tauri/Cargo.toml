[package]
name = "ruz"
description = "Ruz — a Persian calendar for the menu bar and system tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ruz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
jiff = "0.2.38"
keyring = "4"
reqwest = { version = "0.13", features = ["form", "json"] }
ruz-core = { version = "0.1.0", path = "../crates/ruz-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5"
tiny-skia = "0.12.0"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-location = "0.3"
objc2-event-kit = "0.3"
objc2-foundation = "0.3"
